{{- if .Values.localJobs }}
# Comp jobs process untrusted input files and parameters. Allow them only DNS, the services they need and the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comp-job
spec:
  podSelector:
    matchLabels:
      comp-job: ""
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      # DNS, TCP for large responses. OpenShift DNS pods listen on 5353 behind the service port 53.
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Chipster services used by SingleShotComp
    - to:
        - podSelector:
            matchExpressions:
              - key: name
                operator: In
                values: [service-locator, session-db, file-broker, toolbox, scheduler]
      ports:
        - port: api
    # internet, but not private networks or the metadata service
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # private network: OpenShift pods (10.128.0.0/14 by default), possibly other internal hosts
              - 10.0.0.0/8
              # private network: OpenShift services (172.30.0.0/16 by default)
              - 172.16.0.0/12
              # private network, possibly used by nodes or other internal hosts
              - 192.168.0.0/16
              # shared address space (RFC 6598), used internally by OVN-Kubernetes (100.64.0.0/16 by default)
              - 100.64.0.0/10
              # link-local: cloud metadata service (169.254.169.254)
              - 169.254.0.0/16
{{- end }}
