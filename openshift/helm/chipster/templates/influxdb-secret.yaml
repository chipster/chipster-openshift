apiVersion: v1
kind: Secret
metadata:
  name: influxdb
  labels:
    app: chipster
type: Opaque
stringData:
  admin-password: {{ required "influxdb.adminPassword is required" $.Values.influxdb.adminPassword | quote }}
  writer-password: {{ required "influxdb.writerPassword is required" $.Values.influxdb.writerPassword | quote }}
  reader-password: {{ required "influxdb.readerPassword is required" $.Values.influxdb.readerPassword | quote }}
